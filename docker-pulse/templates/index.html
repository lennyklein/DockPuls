<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockerPulse - Homelab Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold tracking-wider text-blue-400">⚡ DockerPulse</h1>
            <span class="text-sm bg-gray-800 text-gray-400 px-3 py-1 rounded-full border border-gray-700">ZimaOS Node</span>
        </header>

        <div class="bg-gray-800 shadow-xl rounded-xl p-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-gray-200">Aktive Container</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4">Image</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">CPU</th>
                            <th class="py-3 px-4">RAM</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in containers %}
                        <tr class="border-b border-gray-700/50 hover:bg-gray-750">
                            <td class="py-3 px-4 font-medium text-white">{{ c.name }}</td>
                            <td class="py-3 px-4 text-gray-400 text-sm">{{ c.image }}</td>
                            <td class="py-3 px-4">
                                {% if c.status == 'running' %}
                                    <span class="bg-green-500/10 text-green-400 text-xs px-2.5 py-1 rounded-full border border-green-500/20 font-semibold">● Läuft</span>
                                {% else %}
                                    <span class="bg-red-500/10 text-red-400 text-xs px-2.5 py-1 rounded-full border border-red-500/20 font-semibold">■ {{ c.status }}</span>
                                {% endif %}
                            </td>
                            <td class="py-3 px-4 text-gray-300 font-mono text-sm">{{ c.cpu }}</td>
                            <td class="py-3 px-4 text-gray-300 font-mono text-sm">{{ c.memory }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
